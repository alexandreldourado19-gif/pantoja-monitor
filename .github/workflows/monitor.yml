name: Monitor Pantoja11

on:
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 30 minutos
  workflow_dispatch:        # Permite rodar manualmente no painel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Executar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Salvar alterações no histórico
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/produtos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza histórico de produtos" && git push)
          
